name: PayRail CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: payrail_admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: payrail_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGDATABASE: payrail_test_db
      PGUSER: payrail_admin
      PGPASSWORD: test_password
      PGHOST: 127.0.0.1
      PGPORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: python -m pip install -r requirements.txt

      - name: Create test schema
        run: |
          psql -c "
          CREATE TABLE accounts (
              account_id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
              name TEXT NOT NULL,
              balance BIGINT NOT NULL CHECK (balance >= 0)
          );
          "

      - name: Run PayRail tests
        run: python -m pytest tests/test_payments.py -q
