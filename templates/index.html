<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PayRail</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 380px;
            padding: 32px;
            border-radius: 14px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #111;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;

            display: none;
        }

        .success {
            display: block !important;
            background: #e8f7ed;
            color: #176b35;
        }

        .error {
            display: block !important;
            background: #fdeaea;
            color: #9c1c1c;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>PayRail</h1>

    <div class="subtitle">
        Mock payment rail
    </div>

    <form id="paymentForm">

        <label for="sender">Sender</label>
        <input
            id="sender"
            type="text"
            placeholder="abhay"
            required
        >

        <label for="receiver">Receiver</label>
        <input
            id="receiver"
            type="text"
            placeholder="rahul"
            required
        >

        <label for="amount">Amount (₹)</label>
        <input
            id="amount"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="100"
            required
        >

        <button id="payButton" type="submit">
            Pay
        </button>

    </form>

    <div id="result"></div>

</div>


<script>

const form = document.getElementById("paymentForm");
const result = document.getElementById("result");
const payButton = document.getElementById("payButton");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const sender =
        document.getElementById("sender").value.trim();

    const receiver =
        document.getElementById("receiver").value.trim();

    const rupees =
        Number(document.getElementById("amount").value);


    /*
        Backend stores money in paise.

        ₹100
        ->
        10000 paise
    */

    const amount = Math.round(rupees * 100);


    payButton.disabled = true;
    payButton.textContent = "Processing...";

    result.className = "";
    result.style.display = "none";


    try {

        const response = await fetch("/payments", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                sender: sender,
                receiver: receiver,
                amount: amount
            })
        });


        const data = await response.json();


        if (response.ok) {

            result.className = "success";

            result.textContent =
                `Payment successful — ₹${rupees.toFixed(2)}` +
                (data.etime
                    ? ` (${data.etime.toFixed(2)} ms)`
                    : "");

        } else {

            result.className = "error";

            result.textContent =
                data.message || "Payment failed";
        }


    } catch (error) {

        result.className = "error";

        result.textContent =
            "Could not reach PayRail server";
    }


    payButton.disabled = false;
    payButton.textContent = "Pay";

});

</script>

</body>
</html>
